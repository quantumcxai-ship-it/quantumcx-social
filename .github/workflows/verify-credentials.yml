name: Verify Instagram credentials

# TEMPORARY. Proves the secrets actually work before the first scheduled post,
# then gets deleted. Run it from the Actions tab; it is never scheduled.
#
# WHAT IT PROVES, without publishing anything:
#   1. the token is valid and bound to the right account
#   2. IG_USER_ID matches the account the token belongs to
#   3. instagram_business_content_publish is really granted
#   4. Instagram can actually FETCH a card from raw.githubusercontent.com
#
# It proves (3) and (4) by creating a media CONTAINER and stopping there.
# Creating a container runs the full publish path - permission check, image
# fetch, caption validation - but nothing appears on the profile until
# media_publish is called, which this deliberately never does. Unpublished
# containers expire on their own within 24 hours.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Token is valid and points at the right account
        env:
          T: ${{ secrets.IG_ACCESS_TOKEN }}
          U: ${{ secrets.IG_USER_ID }}
          V: ${{ vars.IG_API_VERSION || 'v21.0' }}
        run: |
          set -uo pipefail
          RESP=$(curl -sS -G "https://graph.instagram.com/$V/me" \
            --data-urlencode "fields=id,username" \
            --data-urlencode "access_token=$T")

          if echo "$RESP" | grep -q '"error"'; then
            echo "TOKEN CHECK FAILED. Instagram returned:"
            echo "$RESP" | python3 -c "import sys,json;print(json.dumps(json.load(sys.stdin).get('error',{}),indent=2))"
            exit 1
          fi

          ID=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])")
          NAME=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('username','?'))")
          echo "token is valid"
          echo "  account:  @$NAME"
          echo "  id:       $ID"

          if [ "$ID" != "$U" ]; then
            echo ""
            echo "MISMATCH: the token belongs to $ID but IG_USER_ID is set to $U."
            echo "Publishing would fail. Update the IG_USER_ID secret to $ID."
            exit 1
          fi
          echo "  IG_USER_ID matches the token's account"

      - name: 2. Publish permission and image fetch (container only, nothing posted)
        env:
          T: ${{ secrets.IG_ACCESS_TOKEN }}
          U: ${{ secrets.IG_USER_ID }}
          V: ${{ vars.IG_API_VERSION || 'v21.0' }}
          IMG: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/cards/quantumcx-ig-001.png
        run: |
          set -uo pipefail
          echo "asking Instagram to fetch: $IMG"
          RESP=$(curl -sS -X POST "https://graph.instagram.com/$V/$U/media" \
            --data-urlencode "image_url=$IMG" \
            --data-urlencode "caption=Credential check - not published." \
            --data-urlencode "access_token=$T")

          if echo "$RESP" | grep -q '"error"'; then
            echo "CONTAINER CREATION FAILED. Instagram returned:"
            echo "$RESP" | python3 -c "import sys,json;print(json.dumps(json.load(sys.stdin).get('error',{}),indent=2))"
            echo ""
            echo "Common causes:"
            echo "  code 200 / OAuth  -> instagram_business_content_publish is missing."
            echo "                       Add it under Permissions and features, then"
            echo "                       GENERATE A NEW TOKEN (scopes are fixed at issue)."
            echo "  'media could not be fetched' -> the image URL is not publicly"
            echo "                       reachable. Check the repo is public."
            exit 1
          fi

          CID=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])")
          echo ""
          echo "container created: $CID"
          echo "Instagram accepted the permission, fetched the image and accepted the caption."
          echo "NOT publishing it. This container expires by itself within 24 hours."

      - name: Result
        run: |
          echo "All checks passed. The scheduled workflow will publish correctly."
          echo "Nothing was posted to the profile."
