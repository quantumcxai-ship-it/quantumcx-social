name: Verify LinkedIn credentials

# TEMPORARY, deleted once it passes. Proves the LinkedIn secrets work before
# the first scheduled post.
#
# WHAT IT PROVES, without publishing anything:
#   1. the token is valid and identifies the right member
#   2. LI_PERSON_URN matches the member the token belongs to
#   3. the LinkedIn-Version header is still accepted (a retired version
#      returns 426, which is what currently breaks Postiz for everyone)
#   4. w_member_social really allows an image upload
#
# It runs the full posting path except the final POST /rest/posts. An image
# uploaded but never referenced by a post is not visible anywhere.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 1. Token is valid and identifies the right member
        env:
          T: ${{ secrets.LI_ACCESS_TOKEN }}
          P: ${{ secrets.LI_PERSON_URN }}
        run: |
          set -uo pipefail
          RESP=$(curl -sS "https://api.linkedin.com/v2/userinfo" -H "Authorization: Bearer $T")

          if ! echo "$RESP" | grep -q '"sub"'; then
            echo "TOKEN CHECK FAILED. LinkedIn returned:"
            echo "$RESP" | head -c 600
            echo ""
            echo "A 401 here usually means the token is expired or was generated"
            echo "without the openid/profile scopes."
            exit 1
          fi

          SUB=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin)['sub'])")
          NAME=$(echo "$RESP" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('name','?'))")
          echo "token is valid"
          echo "  member:   $NAME"
          echo "  sub:      $SUB"

          CLEAN=${P#urn:li:person:}
          if [ "$SUB" != "$CLEAN" ]; then
            echo ""
            echo "MISMATCH: the token belongs to $SUB but LI_PERSON_URN is $CLEAN."
            echo "Posting would fail. Update LI_PERSON_URN to $SUB."
            exit 1
          fi
          echo "  LI_PERSON_URN matches the token's member"

      - name: 2. Version header and w_member_social upload permission
        env:
          T: ${{ secrets.LI_ACCESS_TOKEN }}
          P: ${{ secrets.LI_PERSON_URN }}
          V: ${{ vars.LINKEDIN_VERSION || '202608' }}
        run: |
          set -uo pipefail
          URN="$P"
          case "$URN" in urn:li:person:*) ;; *) URN="urn:li:person:$URN" ;; esac
          echo "LinkedIn-Version: $V"

          INIT=$(curl -sS -X POST "https://api.linkedin.com/rest/images?action=initializeUpload" \
            -H "Authorization: Bearer $T" \
            -H "LinkedIn-Version: $V" \
            -H "X-Restli-Protocol-Version: 2.0.0" \
            -H "Content-Type: application/json" \
            --data "{\"initializeUploadRequest\":{\"owner\":\"$URN\"}}")

          if ! echo "$INIT" | grep -q '"uploadUrl"'; then
            echo "INITIALIZE UPLOAD FAILED. LinkedIn returned:"
            echo "$INIT" | head -c 700
            echo ""
            echo "Common causes:"
            echo "  426 NONEXISTENT_VERSION -> LinkedIn retired version $V."
            echo "      Set a LINKEDIN_VERSION repository variable to a current"
            echo "      YYYYMM value. No code change needed."
            echo "  403 -> the token lacks w_member_social. Regenerate it with"
            echo "      that scope ticked; scopes are fixed when a token is made."
            exit 1
          fi

          UPLOAD_URL=$(echo "$INIT" | python3 -c "import sys,json;print(json.load(sys.stdin)['value']['uploadUrl'])")
          IMAGE_URN=$(echo "$INIT" | python3 -c "import sys,json;print(json.load(sys.stdin)['value']['image'])")
          echo "upload initialised"
          echo "  image urn: $IMAGE_URN"

          CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X PUT "$UPLOAD_URL" \
            -H "Authorization: Bearer $T" \
            -H "Content-Type: image/png" \
            --data-binary "@cards/quantumcx-ig-001.png")

          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ] && [ "$CODE" != "202" ]; then
            echo "IMAGE UPLOAD FAILED with HTTP $CODE"
            exit 1
          fi
          echo "  image uploaded successfully (HTTP $CODE)"
          echo ""
          echo "The full publish path works up to the final post call, which"
          echo "this deliberately does not make. Nothing is on your feed."

      - name: Result
        run: echo "All LinkedIn checks passed. Nothing was posted."
