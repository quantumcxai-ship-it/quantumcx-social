name: Publish anything due

# THE EXTERNAL TRIGGER ENTRY POINT.
#
# WHY THIS EXISTS. GitHub's own scheduler has never fired in this repository -
# see the scheduler-probe workflow. Manual dispatch works perfectly, so this
# workflow is the thing an outside cron service calls to press that button on
# a timer. It is the automation of last resort, and currently the only one that
# actually runs.
#
# WHY IT HAS NO INPUTS. The per-platform workflows default dry_run to true. A
# dispatch that forgets to send inputs therefore produces a GREEN run that
# publishes NOTHING - the single worst failure mode here, because it looks like
# success. This workflow takes no inputs at all, so it cannot be triggered into
# silently doing nothing. Whatever calls it gets a real publish or a real error.
#
# WHY IT RUNS ALL THREE PLATFORMS. Each script reads its own schedule and its
# own state file, and exits cleanly when nothing is due - making no API call and
# costing nothing, which matters for X where calls are billed. So one trigger a
# few times a day covers Instagram's three slots, LinkedIn's Tue/Wed/Thu slot
# and X's daily slot, with no per-platform timing to keep in sync.
#
# HOW TO CALL IT (repository_dispatch):
#   POST https://api.github.com/repos/OWNER/REPO/dispatches
#   Authorization: Bearer <fine-grained PAT, Contents: read and write>
#   Accept: application/vnd.github+json
#   Body: {"event_type":"publish"}
on:
  repository_dispatch:
    types: [publish]
  workflow_dispatch:

concurrency:
  # Shared with the per-platform workflows. Two runs publishing at once would
  # both read the same state files before either wrote, and could double-post.
  group: social-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Each platform runs even if an earlier one failed: a dead LinkedIn token
      # must not cost you the day's Instagram and X posts. Failures are collected
      # and re-raised at the end so the run still goes red.
      - name: Instagram
        id: ig
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/cards
          IG_API_VERSION: ${{ vars.IG_API_VERSION || 'v21.0' }}
        run: python scripts/post_instagram.py

      - name: LinkedIn
        id: li
        continue-on-error: true
        env:
          LI_ACCESS_TOKEN: ${{ secrets.LI_ACCESS_TOKEN }}
          LI_PERSON_URN: ${{ secrets.LI_PERSON_URN }}
          LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION || '202608' }}
        run: python scripts/post_linkedin.py

      - name: X
        id: x
        continue-on-error: true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_ALT_TEXT: ${{ vars.X_ALT_TEXT || '0' }}
        run: python scripts/post_x.py

      - name: Commit the posted-state files
        if: always()
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "Publish: record posted slots [skip ci]"
            git pull --rebase --autostash origin main
            git push
          else
            echo "no state change to commit"
          fi

      - name: Fail the run if any platform failed
        if: always()
        run: |
          echo "instagram: ${{ steps.ig.outcome }}"
          echo "linkedin:  ${{ steps.li.outcome }}"
          echo "x:         ${{ steps.x.outcome }}"
          if [ "${{ steps.ig.outcome }}" = "failure" ] \
          || [ "${{ steps.li.outcome }}" = "failure" ] \
          || [ "${{ steps.x.outcome }}" = "failure" ]; then
            echo ""
            echo "At least one platform failed. Scroll up for which."
            exit 1
          fi
          echo "all platforms fine"
